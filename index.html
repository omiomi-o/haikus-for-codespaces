<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ツール</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    h1 {
      margin-bottom: 20px;
    }
    button {
      background-color: orange;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    li {
      font-size: 18px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>抽選ツール</h1>
  <button onclick="draw()">抽選する</button>
  <ul id="result"></ul>

  <script>
    const members = [
      "Gimpei", "Bebe", "Shun", "Ricky", "En", "Kanta", "Wataru", "Hiromi",
      "Naoki", "Satoru", "Yoh", "Keisuke", "Moeka", "Kakeru", "Chie", "Misa",
      "Isato", "Kiku"
    ];

    function draw() {
      const shuffled = members
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ value }) => value);

      const numToPick = Math.random() < 0.5 ? 4 : 5; // 50%で4人 or 5人
      const selected = shuffled.slice(0, numToPick);

      const resultList = document.getElementById("result");
      resultList.innerHTML = "";
      selected.forEach(name => {
        const li = document.createElement("li");
        li.textContent = name;
        resultList.appendChild(li);
      });
    }
  </script>
</body>
</html>
